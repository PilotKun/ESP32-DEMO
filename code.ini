#include <Wire.h>
#include <LiquidCrystal_I2C.h>
#include <Keypad.h>
#include <ESP32Servo.h>
#include <SPI.h>
#include <MFRC522.h>

// --- LCD Setup ---
LiquidCrystal_I2C lcd(0x27, 16, 2);

// --- Keypad Setup ---
const byte ROWS = 4;
const byte COLS = 4;
char hexaKeys[ROWS][COLS] = {
  {'1', '2', '3', 'A'},
  {'4', '5', '6', 'B'},
  {'7', '8', '9', 'C'},
  {'*', '0', '#', 'D'}
};
byte rowPins[ROWS] = {19, 18, 5, 17};
byte colPins[COLS] = {16, 4, 0, 2};  
Keypad customKeypad = Keypad(makeKeymap(hexaKeys), rowPins, colPins, ROWS, COLS);

// --- Servo Setup ---
Servo lockServo;
const int servoPin = 13;

// --- RFID Setup ---
#define SS_PIN 15
#define RST_PIN 27
MFRC522 rfid(SS_PIN, RST_PIN);

// --- Buzzer Setup ---
const int buzzerPin = 25;

// --- Security Configurations ---
String secretCode = "1234";
String inputString = "";
// Replace with your authorized NFC Tag UID (e.g., {0xDE, 0xAD, 0xBE, 0xEF})
byte authorizedUID[4] = {0x3A, 0xC5, 0xF1, 0x2E};

void unlockDoor() {
  lcd.clear();
  lcd.setPrint(0, 0); // or print
  lcd.print("Access Granted");
  digitalWrite(buzzerPin, HIGH);
  delay(200);
  digitalWrite(buzzerPin, LOW);
  
  lockServo.write(90); // Unlock angle
  delay(4000);         // Keep unlocked for 4 seconds
  lockServo.write(0);  // Lock angle
  
  lcd.clear();
  lcd.print("Door Locked");
}

void denyAccess() {
  lcd.clear();
  lcd.print("Access Denied");
  for (int i = 0; i < 3; i++) {
    digitalWrite(buzzerPin, HIGH);
    delay(100);
    digitalWrite(buzzerPin, LOW);
    delay(100);
  }
  delay(2000);
  lcd.clear();
  lcd.print("Enter PIN / NFC");
}

bool checkTag(MFRC522::Uid &uid) {
  if (uid.size != 4) return false;
  for (byte i = 0; i < 4; i++) {
    if (uid.uidByte[i] != authorizedUID[i]) return false;
  }
  return true;
}

void setup() {
  Serial.begin(115200);
  SPI.begin();
  rfid.PCD_Init();
  
  pinMode(buzzerPin, OUTPUT);
  lockServo.attach(servoPin);
  lockServo.write(0); // Initial locked position
  
  lcd.init();
  lcd.backlight();
  lcd.setCursor(0, 0);
  lcd.print("ESP32 Smart Lock");
  lcd.setCursor(0, 1);
  lcd.print("Scan NFC or PIN");
}

void loop() {
  // Check Keypad
  char customKey = customKeypad.getKey();
  if (customKey) {
    if (customKey == '#') {
      if (inputString == secretCode) {
        unlockDoor();
      } else {
        denyAccess();
      }
      inputString = "";
    } else if (customKey == '*') {
      inputString = "";
      lcd.clear();
      lcd.print("Cleared");
    } else {
      inputString += customKey;
      lcd.setCursor(0, 1);
      lcd.print("                ");
      lcd.setCursor(0, 1);
      for (unsigned int i = 0; i < inputString.length(); i++) {
        lcd.print("*");
      }
    }
  }

  // Check RFID/NFC
  if (rfid.PICC_IsNewCardPresent() && rfid.PICC_ReadCardSerial()) {
    if (checkTag(rfid.uid)) {
      unlockDoor();
    } else {
      denyAccess();
    }
    rfid.PICC_HaltA();
    rfid.Pyc_StopCrypto1(); // or rfid.PCD_StopCrypto1()
  }
}